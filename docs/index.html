function parseV4(s) {
  const p = s.split('.');
  if (p.length !== 4) return null;
  for (const o of p) if (!/^\d{1,3}$/.test(o) || +o > 255 || (o.length > 1 && o[0] === '0')) return null;

function parseV6(s) {

    const v4 = parseV4(last); if (!v4) return null;
    s = s.slice(0, s.lastIndexOf(':') + 1) + ((v4[0] << 8) | v4[1]).toString(16) + ':' + ((v4[2] << 8) | v4[3]).toString(16);

function compress6(g) {
  let best = -1, len = 0;
  for (let i = 0; i < 8;) {
    if (g[i] !== 0) { i++; continue; }
    let j = i; while (j < 8 && g[j] === 0) j++;
    if (j - i > len) { best = i; len = j - i; }
    i = j;
  }
  const h = g.map((x) => x.toString(16));
  if (len < 2) return h.join(':');
  return h.slice(0, best).join(':') + '::' + h.slice(best + len).join(':');
}
function private4(o) {
  const [a, b, c] = o;
  return a === 0 || a === 10 || a === 127 || (a === 169 && b === 254) || (a === 172 && b >= 16 && b <= 31) ||

''];
let skip = false, bootId = 0, ended = false;
const sleep = (ms) => skip ? Promise.resolve() : new Promise((r) => setTimeout(r, ms));
function reset() {
  fs = initialFS(); cwd = HOME; oldpwd = HOME; lastStatus = 0; hist = hist || []; histPos = hist.length;
}
function bootLine(s) {
  const l = line();
  if (s.startsWith('[  OK  ]')) l.append('[  ', span('g', 'OK'), '  ]' + s.slice(8));
  else if (s.startsWith('[')) { const i = s.indexOf(']') + 1; l.append(span('dim', s.slice(0, i)), s.slice(i)); }
  else l.append(s);
  toEnd();
}
function ready() {
  setPrompt(); $row.hidden = false; $in.value = ''; focusIn(); toEnd();
}
function focusIn() { $in.focus({ preventScroll: true }); }
async function boot(instant) {
  const id = ++bootId;
  $row.hidden = true; $out.replaceChildren(); reset();
  skip = !!instant;
  for (const s of BOOT) { if (id !== bootId) return; bootLine(s); await sleep(s.includes('OK') ? 130 : 45); }
  await sleep(250); if (id !== bootId) return;
  const lg = line(); lg.append('kalix login: ');
  for (const ch of 'kal1x') { lg.append(ch); await sleep(70); if (id !== bootId) return; }
  print('Password:\n');
  await sleep(300); if (id !== bootId) return;
  $out.replaceChildren();
  echoCmd('neofetch');
  $out.append(neofetchEl());
  print("You can type here. Try '--work', '--awards', 'kal1x --help' or 'help'.\n", 'dim');
  skip = true;
  ready();
}
function loggedOut() {
  $row.hidden = true; print('logout\nConnection to kalix closed. Press Enter to log back in.\n', 'dim');
  const again = (e) => { if (e.key === 'Enter') { window.removeEventListener('keydown', again); setTimeout(() => boot(false), 0); } };
  window.addEventListener('keydown', again);
}
$in.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = $in.value; $in.value = '';
    echoCmd(v);
    if (v.trim()) {
      if (hist[hist.length - 1] !== v) hist.push(v);
      histPos = hist.length;
      $row.hidden = true;
      await run(v);
      if (ended) ended = false; else { setPrompt(); $row.hidden = false; focusIn(); }
    }
    toEnd();
  } else if (e.key === 'Tab') { e.preventDefault(); complete(); toEnd(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (histPos > 0) { $in.value = hist[--histPos]; } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (histPos < hist.length - 1) $in.value = hist[++histPos]; else { histPos = hist.length; $in.value = ''; } }
  else if (e.ctrlKey && e.key.toLowerCase() === 'c' && !String(getSelection())) { e.preventDefault(); echoCmd($in.value + '^C'); $in.value = ''; lastStatus = 130; toEnd(); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); $out.replaceChildren(); toEnd(); }
});
window.addEventListener('keydown', () => { if ($row.hidden) skip = true; else if (document.activeElement !== $in && !String(getSelection())) focusIn(); });
document.addEventListener('click', (e) => {
  if ($row.hidden) { skip = true; return; }
  if (e.target.closest('a') || String(getSelection())) return;
  focusIn();
});
boot(window.matchMedia('(prefers-reduced-motion: reduce)').matches);
